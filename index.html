  document.getElementById("urole").textContent = r.role;
  document.getElementById("orgRole").textContent = r.role;
  renderNav();
  document.getElementById("menuItems").innerHTML = Object.entries(ROLES).map(([k, v]) =>
    `<button role="menuitem" class="${k === current ? "on" : ""}" onclick="switchRole('${k}')">${v.name} · ${v.role}</button>`).join("");

  if(page!=="detail"){ document.getElementById("app").innerHTML = `<div class="fade wide">${page==="dashboard"?viewDashboard():page==="handoffs"?viewHandoffs():viewDecisions()}</div>`; return; }
  document.getElementById("app").innerHTML = `
  <div class="fade"><a class="back" onclick="nav('decisions')">← All decisions</a>
    <div class="ctx">${d.context.map((c, i) => i ? `<span>/</span><b>${c}</b>` : `<b>${c}</b>`).join("")}</div>
    <h1>${d.title}</h1>
    <div class="date">${d.date} <span class="pill official">Decision</span><span class="st ${pillCls(d.status)}">${d.status}</span></div>

    <section class="card" aria-labelledby="s1">
      <div class="step" id="s1"><span>1</span>What changed</div>
      <div class="compare">
        <div class="side"><div class="lbl">Before</div><h3>${d.before.title}</h3>${d.id==="fire"?pipe("before"):""}<p class="caption" style="margin-top:6px">${d.before.note}</p></div>
        <div class="arrow">${ic("arr", "width:28px;height:28px")}</div>
        <div class="side new"><div class="lbl">New</div><h3>${d.after.title}</h3>${d.id==="fire"?pipe("after"):""}<p class="caption" style="margin-top:6px">${d.after.note}</p></div>
      </div>
      ${d.caption?`<p class="caption">${d.caption}</p>`:""}
    </section>

    <section class="card" aria-labelledby="s2">
      <div class="step" id="s2"><span>2</span>What does this mean for me?</div>
      <div class="me">${ic("user", "width:16px;height:16px")} Personalized for <b>${r.role}</b> based on your profile</div>
      <p class="summary">${imp.summary}</p>
      ${imp.items.map(it => `<div class="item"><span class="ic">${ic(it.icon)}</span><div><b>${it.title}</b><p>${it.text}</p></div>
        ${it.status === "confirmed" ? `<span class="st ok">${ic("check", "width:13px;height:13px")}Confirmed impact</span>` : `<span class="st tbd">${ic("q", "width:13px;height:13px")}To be checked</span>`}</div>`).join("")}
    </section>

    <section class="card" aria-labelledby="s3">
      <div class="step" id="s3"><span>3</span>Why was this decided?</div>
      <p class="why">${d.why}</p>
      <details><summary>${ic("chev", "width:16px;height:16px")}Background, requirements and related topics</summary>
        <ul>${d.background.map(b => `<li>${b}</li>`).join("")}</ul></details>
    </section>

    ${HANDOFFS.some(h=>h.decision===d.id)?`<section class="card"><div class="step"><span>4</span>Related handoffs</div>${HANDOFFS.filter(h=>h.decision===d.id).map(h=>`<div class="lrow" onclick="page='handoffs';hsel='${h.id}';render();window.scrollTo({top:0})"><span class="ic">${ic("doc")}</span><div><b>${h.doc}</b><small>${h.from} → ${h.to} · ${h.date}</small></div><span class="st ${HSTAT[h.status]}">${h.status}</span></div>`).join("")}</section>`:""}
    <footer class="sources" aria-label="Sources">
      <div style="font-weight:600;color:var(--ink)">Sources</div>
      <div class="row"><span class="tagx o">Official</span><span>Original decision and fire-safety documentation: <a href="#" onclick="alert('Prototype: link the original decision document here.');return false">Decision of ${d.date} (link placeholder)</a></span></div>
      <div class="row"><span class="tagx f">Example</span><span>The role-specific impacts, names and statuses are fictional assumptions created for this prototype. They are not part of the official decision.</span></div>
    </footer>
  </div>`;
}

function switchRole(k) { current = k; closeMenu(); render(); if(page!=="detail") toast("Signed in as "+ROLES[k].role); window.scrollTo({ top: 0, behavior: "smooth" }); }
const btn = document.getElementById("userBtn"), menu = document.getElementById("menu");
function closeMenu() { menu.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }
btn.onclick = e => { e.stopPropagation(); const o = menu.classList.toggle("open"); btn.setAttribute("aria-expanded", String(o)); };
document.addEventListener("click", e => { if (!menu.contains(e.target)) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
render();
</script>
</body>
</html>
